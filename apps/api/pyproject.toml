[project]
name = "resona-api"
version = "0.1.0"
description = "Local-first evidence-grounded trauma simulation documentation API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pyannote.audio>=4.0,<5",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
package = false

